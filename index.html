<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator Link Undangan</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:30px;
}

.container{
max-width:700px;
margin:auto;
background:#fff;
padding:25px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.15);
}

h1{
text-align:center;
margin-bottom:25px;
color:#b8860b;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input{
width:100%;
padding:12px;
margin-top:8px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
padding:12px 20px;
margin-top:15px;
margin-right:5px;
border:none;
border-radius:8px;
cursor:pointer;
font-size:15px;
}

.generate{
background:#b8860b;
color:white;
}

.copy{
background:#4CAF50;
color:white;
}

.preview{
background:#2196F3;
color:white;
}

.whatsapp{
background:#25D366;
color:white;
}

.output{
margin-top:20px;
background:#f1f1f1;
padding:15px;
border-radius:10px;
word-break:break-all;
font-size:15px;
}

</style>

</head>

<body>

<div class="container">

<h1>Generator Link Undangan</h1>

<label>URL Undangan</label>

<input
id="base"
value="http://habib-maisa.ege.my.id/"
>

<label>Nama Tamu</label>

<input
id="guest"
placeholder="Contoh : anda & Keluarga"
>

<button class="generate" onclick="buatLink()">
Generate Link
</button>

<button class="copy" onclick="copyLink()">
Copy
</button>

<button class="preview" onclick="previewLink()">
Preview
</button>

<button class="whatsapp" onclick="waLink()">
WhatsApp
</button>

<div class="output" id="hasil">

Link akan muncul di sini...

</div>

</div>

<script>

let link="";

function buatLink(){

let base=document.getElementById("base").value.trim();

base=base.replace(/\/$/,"");

let guest=document.getElementById("guest").value.trim();

if(guest==""){

alert("Masukkan nama tamu.");

return;

}

link=base+"?to="+encodeURIComponent(guest);

document.getElementById("hasil").innerHTML=link;

}

function copyLink(){

if(link==""){

alert("Generate link terlebih dahulu.");

return;

}

navigator.clipboard.writeText(link);

alert("Link berhasil disalin.");

}

function previewLink(){

if(link==""){

buatLink();

}

window.open(link,"_blank");

}

function waLink(){

if(link==""){

buatLink();

}

window.open(

"https://wa.me/?text="+encodeURIComponent(link),

"_blank"

);

}

</script>

</body>
</html>
